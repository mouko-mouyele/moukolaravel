# AutoChain Emma+ — Render Blueprint (WEB SEULEMENT, sans base PostgreSQL)
# Render plan gratuit = 1 seule base max. Ne pas creer de database ici.
#
# AVANT de lancer le Blueprint:
# 1. Supprimez les anciens Blueprint / Web Service en echec sur Render
# 2. Trouvez votre PostgreSQL existante (Dashboard -> Search "postgres")
#    OU creez une base sur https://neon.tech (gratuit, recommande)
# 3. Apres Apply, renseignez DATABASE_URL et APP_URL dans Environment

services:
  - type: web
    name: autochain-emma
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: AutoChain Emma+
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: DOCUMENTS_DISK
        value: documents
      - key: BLOCKCHAIN_ENABLED
        value: false
      - key: BLOCKCHAIN_STRICT_SIGNATURES
        value: false
      - key: IPFS_ENABLED
        value: false
      - key: SEED_DEMO
        value: true
      - key: MAIL_MAILER
        value: log
