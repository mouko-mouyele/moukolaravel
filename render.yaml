# AutoChain Emma+ — Render (Web Service Docker)
# SQLite auto si DATABASE_URL absent (demo soutenance).
# Production: ajouter DATABASE_URL (Neon) dans Environment.

services:
  - type: web
    name: autochain-emma
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: AutoChain Emma+
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: array
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: DOCUMENTS_DISK
        value: documents
      - key: BLOCKCHAIN_ENABLED
        value: false
      - key: BLOCKCHAIN_STRICT_SIGNATURES
        value: false
      - key: IPFS_ENABLED
        value: false
      - key: SEED_DEMO
        value: true
      - key: MAIL_MAILER
        value: log
