# AutoChain Emma+ — Déploiement Render (Blueprint)
# Dashboard Render → New → Blueprint → connecter ce repo GitHub

databases:
  - name: autochain-db
    plan: free
    databaseName: autochain_emma
    user: autochain

services:
  - type: web
    name: autochain-emma
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: AutoChain Emma+
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: autochain-db
          property: connectionString
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: DOCUMENTS_DISK
        value: documents
      - key: BLOCKCHAIN_ENABLED
        value: false
      - key: BLOCKCHAIN_STRICT_SIGNATURES
        value: false
      - key: IPFS_ENABLED
        value: false
      - key: SEED_DEMO
        value: true
      - key: MAIL_MAILER
        value: log
